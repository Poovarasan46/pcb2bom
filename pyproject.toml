[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb2bom"
version = "0.1.0"
description = "AI-powered PCB component detection, OCR marking extraction, and engineering Bill of Materials generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Poovarasan V"}]
keywords = [
    "pcb", "bom", "computer-vision", "ocr", "yolo", "bill-of-materials",
    "electronics", "hardware", "component-detection"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "requests>=2.31",
    "rapidfuzz>=3.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
detection = [
    "ultralytics>=8.1",
    "onnxruntime>=1.16",
]
ocr = [
    "easyocr>=1.7",
    "pytesseract>=0.3.10",
]
all = [
    "pcb2bom[detection,ocr]",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
pcb2bom = "pcb2bom.cli:main"

[project.urls]
Homepage = "https://github.com/Poovarasan46/pcb2bom"
Documentation = "https://github.com/Poovarasan46/pcb2bom#readme"
Issues = "https://github.com/Poovarasan46/pcb2bom/issues"

[project.entry-points."pcb2bom.plugins"]
debug_interfaces = "pcb2bom.plugins.builtin.debug_interfaces:DebugInterfaceAnalyzer"
glitch_surface = "pcb2bom.plugins.builtin.glitch_surface:GlitchSurfaceAnalyzer"
boot_mode = "pcb2bom.plugins.builtin.boot_mode:BootModeAnalyzer"

[tool.setuptools.packages.find]
where = ["src", "pcb2bom"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["pcb2bom/tests", "tests"]
